name: Keep Render Backend Awake

on:
  schedule:
    # ஒவ்வொரு 5 நிமிடத்துக்கும் ஒருமுறை ஓடும் (GitHub free tier-ல் minimum ~5 min)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # Actions tab-ல் manual-ஆவும் run பண்ணலாம்

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend to keep it awake and trigger a fresh scrape
        run: |
          curl -sS "https://news-hnn4.onrender.com/api/news?language=en" -o /dev/null -w "Status: %{http_code}\n"
