name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a full blocking scrape cycle (keeps Render awake until it finishes)
        run: |
          curl -sS --max-time 200 "https://news-hnn4.onrender.com/api/scrape-now" -w "\nStatus: %{http_code}\n"
